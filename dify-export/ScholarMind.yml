    - data:
        code: "import urllib.request\nimport urllib.parse\nimport xml.etree.ElementTree\
          \ as ET\nimport ssl\n\ndef main(search_query: str) -> dict:\n    ctx = ssl.create_default_context()\n\
          \    ctx.check_hostname = False\n    ctx.verify_mode = ssl.CERT_NONE\n\n\
          \    base = \"https://export.arxiv.org/api/query?\"\n    params = {\n  \
          \      \"search_query\": \"all:\" + search_query,\n        \"start\": 0,\n\
          \        \"max_results\": 8,\n        \"sortBy\": \"relevance\",\n     \
          \   \"sortOrder\": \"descending\",\n    }\n    url = base + urllib.parse.urlencode(params)\n\
          \n    req = urllib.request.Request(url, headers={\"User-Agent\": \"ScholarMind/1.0\"\
          })\n    with urllib.request.urlopen(req, timeout=25, context=ctx) as resp:\n\
          \        raw = resp.read().decode(\"utf-8\")\n\n    ns = {\"a\": \"http://www.w3.org/2005/Atom\"\
          }\n    root = ET.fromstring(raw)\n    entries = root.findall(\"a:entry\"\
          , ns)\n\n    papers = []\n    for e in entries:\n        title = e.find(\"\
          a:title\", ns)\n        summary = e.find(\"a:summary\", ns)\n        published\
          \ = e.find(\"a:published\", ns)\n        idl = e.find(\"a:id\", ns)\n  \
          \      authors = [a.find(\"a:name\", ns).text for a in e.findall(\"a:author\"\
          , ns) if a.find(\"a:name\", ns) is not None]\n\n        arxiv_id = \"\"\n\
          \        if idl is not None and idl.text:\n            arxiv_id = idl.text.strip().split(\"\
          /abs/\")[-1]\n\n        papers.append({\n            \"title\": (title.text\
          \ or \"\").strip() if title is not None else \"\",\n            \"authors\"\
          : \", \".join(authors),\n            \"summary\": (summary.text or \"\"\
          ).strip() if summary is not None else \"\",\n            \"published\":\
          \ (published.text or \"\").strip() if published is not None else \"\",\n\
          \            \"arxiv_id\": arxiv_id,\n        })\n\n    lines = []\n   \
          \ for i, p in enumerate(papers, 1):\n        lines.append(\n           \
          \ \"[Paper \" + str(i) + \"]\\n\"\n            \"Title: \" + p[\"title\"\
          ] + \"\\n\"\n            \"Authors: \" + p[\"authors\"] + \"\\n\"\n    \
          \        \"arXiv ID: \" + p[\"arxiv_id\"] + \"\\n\"\n            \"Published:\
          \ \" + p[\"published\"] + \"\\n\"\n            \"Abstract: \" + p[\"summary\"\
          ] + \"\\n\"\n        )\n    papers_text = \"\\n\".join(lines) if lines else\
          \ \"No papers found.\"\n\n    return {\"papers_text\": papers_text, \"count\"\
          : len(papers)}"
        code_language: python3
